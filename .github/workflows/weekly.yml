# Tuesday production run after MNF. Normal runs restore historical core
# features from a small cache, then download the active-season sources and
# rebuild only the two most recently completed weeks plus any missing games.
# A cold cache bootstraps old team/QB summaries one season at a time without
# saving historical raw play-by-play.
name: weekly
on:
  # Supabase pg_cron: nfl-weekly-dispatch, Tuesdays at 8:00 AM Pacific.
  repository_dispatch:
    types: [nfl-weekly]
  workflow_dispatch:
    inputs:
      playoffs_only:
        description: Refresh and publish only the playoff forecast
        type: boolean
        default: false

concurrency:
  group: nfl-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Resolve NFL season
        id: context
        shell: bash
        run: |
          year=$(date -u +%Y)
          month=$(date -u +%m)
          if [ "$month" -le 2 ]; then
            season=$((year - 1))
            active=true
          elif [ "$month" -ge 8 ]; then
            season=$year
            active=true
          else
            season=$year
            active=false
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            active=true
          fi
          echo "season=$season" >> "$GITHUB_OUTPUT"
          echo "active=$active" >> "$GITHUB_OUTPUT"
      - name: Restore core data cache
        id: core-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            backend/data/processed/team_games
            backend/data/processed/qb_games
            backend/data/raw/depth_charts
            backend/data/raw/injuries
          key: nfl-core-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'backend/nflverse/data.py', 'backend/features/drives.py', 'backend/features/qb.py', 'backend/features/scoring.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nfl-core-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'backend/nflverse/data.py', 'backend/features/drives.py', 'backend/features/qb.py', 'backend/features/scoring.py') }}-
      - name: Restore active-season unit data cache
        if: steps.context.outputs.active == 'true'
        id: unit-cache
        uses: actions/cache/restore@v4
        with:
          path: backend/data/processed/unit_games
          key: nfl-units-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'backend/nflverse/data.py', 'backend/features/drives.py', 'backend/features/units.py') }}-${{ steps.context.outputs.season }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nfl-units-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'backend/nflverse/data.py', 'backend/features/drives.py', 'backend/features/units.py') }}-${{ steps.context.outputs.season }}-
      - uses: actions/setup-python@v5
        if: steps.context.outputs.active == 'true'
        with:
          python-version: "3.12"
      - name: Install poetry
        if: steps.context.outputs.active == 'true'
        run: pipx install poetry
      - name: Install dependencies
        if: steps.context.outputs.active == 'true'
        run: poetry sync --no-interaction
      - name: Bootstrap missing historical core features
        if: steps.context.outputs.active == 'true'
        run: >-
          poetry run python -m backend bootstrap-history
          --through $(( ${{ steps.context.outputs.season }} - 1 ))
      - name: Ingest active season
        if: steps.context.outputs.active == 'true'
        run: >-
          poetry run python -m backend ingest
          --seasons ${{ steps.context.outputs.season }}
      - name: Grade completed games
        if: steps.context.outputs.active == 'true' && inputs.playoffs_only != true
        run: >-
          poetry run python -m backend grade
          --season ${{ steps.context.outputs.season }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Build active-season features
        if: steps.context.outputs.active == 'true'
        run: >-
          poetry run python -m backend features --incremental --lookback-weeks 2
          --seasons ${{ steps.context.outputs.season }}
      - name: Save updated core data cache
        if: steps.context.outputs.active == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            backend/data/processed/team_games
            backend/data/processed/qb_games
            backend/data/raw/depth_charts
            backend/data/raw/injuries
          key: ${{ steps.core-cache.outputs.cache-primary-key }}
      - name: Save updated active-season unit data cache
        if: steps.context.outputs.active == 'true' && hashFiles('backend/data/processed/unit_games/*.parquet') != ''
        uses: actions/cache/save@v4
        with:
          path: backend/data/processed/unit_games
          key: ${{ steps.unit-cache.outputs.cache-primary-key }}
      - name: Restore approved model artifacts
        if: steps.context.outputs.active == 'true'
        uses: actions/cache@v4
        with:
          path: backend/data/processed/calibration
          key: nfl-artifacts-${{ runner.os }}-${{ hashFiles('backend/model/**/*.py', 'backend/features/**/*.py', 'backend/etl/**/*.py', 'backend/data_static/*', 'backend/config.py', 'pyproject.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nfl-artifacts-${{ runner.os }}-${{ hashFiles('backend/model/**/*.py', 'backend/features/**/*.py', 'backend/etl/**/*.py', 'backend/data_static/*', 'backend/config.py', 'pyproject.toml') }}-
      - name: Build or verify fixed-model pricing and backtest artifacts
        if: steps.context.outputs.active == 'true' && inputs.playoffs_only != true
        run: poetry run python -m backend production-artifacts
      - name: Retain reviewable model artifacts
        if: steps.context.outputs.active == 'true' && inputs.playoffs_only != true
        uses: actions/upload-artifact@v4
        with:
          name: nfl-production-artifacts
          path: backend/data/processed/calibration
          retention-days: 90
          if-no-files-found: error
      - name: Fit ratings and project next week
        if: steps.context.outputs.active == 'true' && inputs.playoffs_only != true
        run: >-
          poetry run python -m backend fit
          --season ${{ steps.context.outputs.season }}
      - name: Project regular-season wins
        if: steps.context.outputs.active == 'true' && inputs.playoffs_only != true
        run: >-
          poetry run python -m backend season-wins
          --season ${{ steps.context.outputs.season }}
      - name: Odds snapshot
        id: odds
        if: steps.context.outputs.active == 'true' && inputs.playoffs_only != true
        run: >-
          poetry run python -m backend odds
          --season ${{ steps.context.outputs.season }}
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_BOOKMAKERS: ${{ vars.ODDS_API_BOOKMAKERS }}
          ODDS_SOURCE: ${{ vars.ODDS_SOURCE || 'odds_api' }}
      - name: Report unavailable priced markets
        if: steps.odds.outcome == 'failure'
        run: echo "::warning::Odds refresh failed. Publishing model forecasts without a fresh priced-market snapshot."
      - name: Publish
        if: steps.context.outputs.active == 'true' && inputs.playoffs_only != true
        run: >-
          poetry run python -m backend publish
          --season ${{ steps.context.outputs.season }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Build playoff forecast from refreshed injury reports
        if: steps.context.outputs.active == 'true'
        run: >-
          poetry run python -m backend.playoffs.forecast
          --season ${{ steps.context.outputs.season }}
          --require-current-injuries
          --output output/nfl-playoffs/weekly.json
      - name: Retain playoff forecast
        if: steps.context.outputs.active == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nfl-playoff-forecast
          path: output/nfl-playoffs/weekly.json
          retention-days: 90
          if-no-files-found: error
      - name: Publish playoff forecast
        if: steps.context.outputs.active == 'true' && vars.NFL_PLAYOFFS_ENABLED == 'true'
        run: poetry run python -m backend.playoffs.publish output/nfl-playoffs/weekly.json --publish
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Retain prospective source receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-source-receipts
          path: backend/data/processed/source_archive
          retention-days: 90
          if-no-files-found: ignore
      - name: Retain immutable forecast replay bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-forecast-archive-${{ github.run_id }}
          path: backend/data/processed/forecast_archive
          retention-days: 90
          if-no-files-found: ignore
      - name: Build and publish awards after the weekly refresh
        if: steps.context.outputs.active == 'true' && vars.NFL_AWARDS_ENABLED == 'true' && inputs.playoffs_only != true
        uses: ./.github/actions/awards
        with:
          season: ${{ steps.context.outputs.season }}
          publish: 'true'
          reuse-pbp: 'true'
          database-url: ${{ secrets.DATABASE_URL }}
      - name: Restore position grade model and season artifacts
        if: steps.context.outputs.active == 'true' && vars.NFL_PLAYER_GRADES_ENABLED == 'true' && inputs.playoffs_only != true
        uses: actions/cache@v4
        with:
          path: |
            backend/data/processed/players
            backend/data/raw/pbp
          key: nfl-players-v1-${{ hashFiles('backend/players/**/*.py') }}-${{ steps.context.outputs.season }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nfl-players-v1-${{ hashFiles('backend/players/**/*.py') }}-${{ steps.context.outputs.season }}-
            nfl-players-v1-${{ hashFiles('backend/players/**/*.py') }}-
      - name: Fit the position grade when no frozen model exists
        if: steps.context.outputs.active == 'true' && vars.NFL_PLAYER_GRADES_ENABLED == 'true' && inputs.playoffs_only != true
        shell: bash
        env:
          SEASON: ${{ steps.context.outputs.season }}
        run: |
          if ls backend/data/processed/players/models/position_grade_*.json >/dev/null 2>&1; then
            echo "frozen position grade model present"
          else
            last=$((SEASON - 1))
            poetry run python -m backend position-traits-fit \
              --dev-seasons $(seq 2016 $((last - 1))) --validate "$last"
          fi
      - name: Score and publish position traits
        if: steps.context.outputs.active == 'true' && vars.NFL_PLAYER_GRADES_ENABLED == 'true' && inputs.playoffs_only != true
        run: |
          poetry run python -m backend player-sources --seasons $(seq 2016 ${{ steps.context.outputs.season }})
          poetry run python -m backend position-traits --seasons ${{ steps.context.outputs.season }}
          poetry run python -m backend publish-position-traits --season ${{ steps.context.outputs.season }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
