[project]
name = "momentumnfl"
version = "1.0.0"
description = "Bayesian NFL power ratings and point-spread projections from nflverse play-by-play"
authors = [{ name = "Rene Nunez", email = "renenunezgalaviz@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas (>=2.3,<3.0)",
    "numpy (>=2.4,<3.0)",
    "pyarrow (>=17.0,<18.0)",
    "requests (>=2.32,<3.0)",
    "python-dotenv (>=1.1,<2.0)",
    "scipy (>=1.17,<2.0)",
    "sqlalchemy (>=2.0.52,<3.0)",
    "psycopg2-binary (>=2.9.12,<3.0)",
    "nflreadpy (>=0.1.5,<0.2.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
ruff = "^0.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "BLE", "UP"]
